<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>Buildwise OG Image</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url('fonts/inter-medium.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 700;
      font-display: block;
      src: url('fonts/inter-bold.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Instrument Serif';
      font-style: italic;
      font-weight: 400;
      font-display: block;
      src: url('fonts/instrument-serif-italic.ttf') format('truetype');
    }

    :root {
      --canvas: #F8F7F5;
      --ink: #1A1A1A;
      --amber: #D4A574;
      --muted: #5C6470;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .og {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }

    .og__glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% -10%, rgba(212, 165, 116, 0.12), transparent 65%);
      pointer-events: none;
    }

    .og__grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(46, 34, 24, 0.04) 1px, transparent 0);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .og__noise {
      position: absolute;
      inset: 0;
      opacity: 0.015;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .staffing-rail {
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: var(--amber);
      z-index: 10;
    }

    .logo {
      position: absolute;
      top: 64px;
      left: 72px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 20;
    }

    .logo__icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .logo__wordmark {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: var(--ink);
      line-height: 1;
    }

    .tagline-block {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 50%;
      transform: translateY(-42%);
      text-align: left;
      z-index: 20;
    }

    .tagline-primary {
      font-size: 52px;
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 20px;
    }

    .tagline-primary .accent {
      color: var(--amber);
    }

    .tagline-sub {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 34px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--muted);
    }

    .tagline-sub .arrow {
      color: var(--amber);
      font-style: normal;
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="og__glow" aria-hidden="true"></div>
    <div class="og__grid" aria-hidden="true"></div>
    <div class="og__noise" aria-hidden="true"></div>
    <div class="staffing-rail" aria-hidden="true"></div>

    <div class="logo">
      <svg class="logo__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#D4A574" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22c6.23-.05 7.87-5.57 7.5-10-.36-4.34-3.95-9.96-7.5-10-3.55.04-7.14 5.66-7.5 10-.37 4.43 1.27 9.95 7.5 10z"/>
      </svg>
      <span class="logo__wordmark">Buildwise</span>
    </div>

    <div class="tagline-block">
      <p class="tagline-primary">
        Staffing AI agents for<br>
        <span class="accent">professional services</span>
      </p>
      <p class="tagline-sub">
        <span class="arrow">→</span> they don't work like software, they work like hires
      </p>
    </div>
  </div>
</body>
</html>
