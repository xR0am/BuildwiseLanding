<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1584">
  <title>Buildwise LinkedIn Banner — Company</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url('fonts/inter-medium.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 700;
      font-display: block;
      src: url('fonts/inter-bold.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Instrument Serif';
      font-style: italic;
      font-weight: 400;
      font-display: block;
      src: url('fonts/instrument-serif-italic.ttf') format('truetype');
    }

    :root {
      --canvas: #F8F7F5;
      --ink: #1A1A1A;
      --amber: #D4A574;
      --muted: #5C6470;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .banner {
      position: relative;
      width: 1584px;
      height: 396px;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }

    .banner__glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% -20%, rgba(212, 165, 116, 0.10), transparent 70%);
      pointer-events: none;
    }

    .banner__grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(46, 34, 24, 0.04) 1px, transparent 0);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .banner__noise {
      position: absolute;
      inset: 0;
      opacity: 0.015;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .banner__logo-fade {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 320px;
      height: 200px;
      background: linear-gradient(135deg, rgba(248, 247, 245, 0.95) 0%, transparent 70%);
      pointer-events: none;
    }

    .staffing-rail {
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: var(--amber);
      z-index: 10;
    }

    .tagline-block {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(1100px, 88%);
      text-align: center;
      z-index: 20;
    }

    .tagline-primary {
      font-size: 40px;
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1.12;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .tagline-primary .accent {
      color: var(--amber);
    }

    .tagline-sub {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--muted);
    }

    .tagline-sub .arrow {
      color: var(--amber);
      font-style: normal;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="banner__glow" aria-hidden="true"></div>
    <div class="banner__grid" aria-hidden="true"></div>
    <div class="banner__noise" aria-hidden="true"></div>
    <div class="banner__logo-fade" aria-hidden="true"></div>
    <div class="staffing-rail" aria-hidden="true"></div>

    <div class="tagline-block">
      <p class="tagline-primary">
        Staffing AI agents for<br>
        <span class="accent">professional services</span>
      </p>
      <p class="tagline-sub">
        <span class="arrow">→</span> they don't work like software, they work like hires
      </p>
    </div>
  </div>
</body>
</html>
