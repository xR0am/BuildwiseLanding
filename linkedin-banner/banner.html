<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1584">
  <title>Buildwise LinkedIn Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #F8F7F5;
      --ink: #1A1A1A;
      --amber: #D4A574;
      --amber-deep: #B8895A;
      --brown: #2D1B10;
      --muted: #5C6470;
      --line: #E2DDD4;
      --subtle: #64748B;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: var(--canvas);
    }

    .banner {
      position: relative;
      width: 1584px;
      height: 396px;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }

    /* Background treatments */
    .banner__glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% -20%, rgba(212, 165, 116, 0.10), transparent 70%);
      pointer-events: none;
    }

    .banner__grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(46, 34, 24, 0.04) 1px, transparent 0);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .banner__noise {
      position: absolute;
      inset: 0;
      opacity: 0.03;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* Profile photo safe zone fade (bottom-left) */
    .banner__photo-fade {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 420px;
      height: 220px;
      background: linear-gradient(135deg, rgba(248, 247, 245, 0.95) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Staffing rail */
    .staffing-rail {
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: var(--amber);
      z-index: 10;
    }

    /* Logo block */
    .logo {
      position: absolute;
      top: 48px;
      left: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }

    .logo__icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .logo__wordmark {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: var(--ink);
      line-height: 1;
    }

    /* Tagline block — center-right safe zone */
    .tagline-block {
      position: absolute;
      right: 80px;
      top: 50%;
      transform: translateY(-50%);
      max-width: 720px;
      text-align: right;
      z-index: 20;
    }

    .tagline-primary {
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .tagline-primary .accent {
      color: var(--amber);
    }

    .tagline-sub {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 22px;
      font-weight: 400;
      line-height: 1.35;
      color: var(--muted);
    }

    .tagline-sub .arrow {
      color: var(--amber);
      font-style: normal;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="banner__glow" aria-hidden="true"></div>
    <div class="banner__grid" aria-hidden="true"></div>
    <div class="banner__noise" aria-hidden="true"></div>
    <div class="banner__photo-fade" aria-hidden="true"></div>
    <div class="staffing-rail" aria-hidden="true"></div>

    <div class="logo">
      <img class="logo__icon" src="egg-logo.svg" alt="" width="28" height="28">
      <span class="logo__wordmark">Buildwise</span>
    </div>

    <div class="tagline-block">
      <p class="tagline-primary">
        Staffing AI agents for <span class="accent">professional services</span>
      </p>
      <p class="tagline-sub">
        <span class="arrow">→</span> they don't work like software, they work like hires
      </p>
    </div>
  </div>
</body>
</html>
