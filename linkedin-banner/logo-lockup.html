<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buildwise Logo Export</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 700;
      font-display: block;
      src: url('fonts/inter-bold.ttf') format('truetype');
    }

    :root {
      --ink: #1A1A1A;
      --amber: #D4A574;
      --canvas: #FFFFFF;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 300px;
      height: 300px;
      overflow: hidden;
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .logo-square {
      width: 300px;
      height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--canvas);
    }

    .logo-square__icon {
      width: 72px;
      height: 72px;
    }

    .logo-square__wordmark {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="logo-square">
    <svg class="logo-square__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#D4A574" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 22c6.23-.05 7.87-5.57 7.5-10-.36-4.34-3.95-9.96-7.5-10-3.55.04-7.14 5.66-7.5 10-.37 4.43 1.27 9.95 7.5 10z"/>
    </svg>
    <span class="logo-square__wordmark">Buildwise</span>
  </div>
</body>
</html>
